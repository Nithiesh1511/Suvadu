# Builds the Vite app and publishes dist/ to GitHub Pages
# (https://nithiesh1511.github.io/Suvadu/).
# Requires: Settings → Pages → Source = "GitHub Actions", and the VITE_* values
# below added under Settings → Secrets and variables → Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GA4_ID: ${{ secrets.VITE_GA4_ID }}
          VITE_SITE_URL: https://nithiesh1511.github.io/Suvadu
      # Pages has no SPA rewrites: serve the app for unknown paths so deep
      # links and refreshes (e.g. /Suvadu/products/x) don't 404.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
